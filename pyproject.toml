[build-system]
requires = ["setuptools"]

[project]
name = "image_sorter"
authors = [
    {name = "Luc", email = "lucifiel1618@gmail.com"},
]
description = "Image comparison and ordering"
readme = "README.md"
requires-python = ">=3.13"
version = "2.2.0"

dependencies = [
    "imageio"
]

[project.optional-dependencies]
opencv = ["opencv-python", "scikit-image", "imutils"]
imgutils = ["dghs-imgutils", "onnx", "onnxruntime"]